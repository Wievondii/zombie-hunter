<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="description" content="像素僵尸猎人 - 像素风格僵尸生存射击游戏">
  <meta name="keywords" content="僵尸,射击,像素,游戏,zombie,hunter,pixel">
  <meta name="theme-color" content="#0a0a15">
  <meta property="og:title" content="像素僵尸猎人 v3.0">
  <meta property="og:description" content="像素风格僵尸生存射击游戏">
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect x='6' y='4' width='20' height='24' fill='%235D8A3C'/><rect x='8' y='10' width='4' height='4' fill='%23FF0000'/><rect x='20' y='10' width='4' height='4' fill='%23FF0000'/><rect x='10' y='20' width='12' height='4' fill='%23333'/></svg>">
  <title>像素僵尸猎人 v3.0</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body {
      width: 100%; height: 100%;
      background: #000;
      overflow: hidden;
      font-family: 'Courier New', monospace;
      user-select: none; -webkit-user-select: none;
      -webkit-tap-highlight-color: transparent;
      cursor: crosshair;
    }
    #game-canvas {
      display: block;
      position: absolute;
      top: 0; left: 0;
      image-rendering: pixelated; image-rendering: crisp-edges;
      transform-origin: top left;
    }
    body.crt-scanlines #game-canvas {
      filter: contrast(1.05) brightness(0.98);
    }
    body.crt-scanlines::after {
      content: ''; position: fixed; top: 0; left: 0; width: 100vw; height: 100vh;
      pointer-events: none; z-index: 99;
      background: repeating-linear-gradient(0deg, transparent, transparent 2px, rgba(0,0,0,0.04) 2px, rgba(0,0,0,0.04) 4px);
    }
    #loading {
      position: fixed; top: 0; left: 0; width: 100vw; height: 100vh;
      display: flex; align-items: center; justify-content: center;
      background: #0a0a15; z-index: 9999; transition: opacity 0.3s;
    }
    #loading.hidden { opacity: 0; pointer-events: none; }
    #loading-text {
      color: #FF4444; font-family: 'Courier New', monospace;
      font-size: 24px; font-weight: bold; animation: pulse 1s infinite;
    }
    @keyframes pulse { 0%,100% { opacity: 1; } 50% { opacity: 0.5; } }
  </style>
</head>
<body>
  <div id="loading"><div id="loading-text">加载中...</div></div>
  <canvas id="game-canvas" width="640" height="360"></canvas>
  <script type="module" src="/src/main.js"></script>
  <script>
    // Scale canvases to fit viewport using CSS transform
    function scaleCanvases() {
      var gw = 640, gh = 360;
      var scale = Math.min(window.innerWidth / gw, window.innerHeight / gh);
      var offsetX = (window.innerWidth - gw * scale) / 2;
      var offsetY = (window.innerHeight - gh * scale) / 2;
      var gameCanvas = document.getElementById('game-canvas');
      var transform = 'translate(' + offsetX + 'px,' + offsetY + 'px) scale(' + scale + ')';
      gameCanvas.style.transform = transform;
      window.__canvasScale = scale;
      window.__canvasOffsetX = offsetX;
      window.__canvasOffsetY = offsetY;
    }
    scaleCanvases();
    window.addEventListener('resize', scaleCanvases);
    window.addEventListener('load', function() {
      setTimeout(function() {
        var el = document.getElementById('loading');
        if (el) el.classList.add('hidden');
        setTimeout(function() { if (el) el.remove(); }, 500);
      }, 300);
    });
  </script>
</body>
</html>
